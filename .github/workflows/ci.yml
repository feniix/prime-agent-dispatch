name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install repository-pinned pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install OpenClaw adapter dependencies
        run: pnpm --dir openclaw-plugin install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format

      - name: Check release configuration and action pins
        run: pnpm run release:check

      - name: Check types
        run: pnpm run typecheck

      - name: Run deterministic tests
        run: pnpm test

      - name: Build and test installed adapter package
        run: |
          pnpm --dir openclaw-plugin run build
          pnpm --dir openclaw-plugin test

      - name: Audit dependencies
        run: |
          pnpm audit --audit-level=high
          pnpm --dir openclaw-plugin audit --audit-level=high
