name: Release Prime runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-prime-runtime
  cancel-in-progress: false

jobs:
  release:
    name: build, attest, and publish Darwin arm64 runtime
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install repository-pinned pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Load and validate the release contract
        id: contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          test "$(node -p 'process.version')" = "v$(jq -r '.target.nodeVersion' release/release.json)"
          pnpm run release:check
          {
            printf 'PRIME_VERSION=%s\n' "$(jq -r '.primeAgent.version' release/release.json)"
            printf 'PRIME_OFFICIAL_URL=%s\n' "$(jq -r '.primeAgent.officialUrl' release/release.json)"
            printf 'PRIME_OFFICIAL_SHA256=%s\n' "$(jq -r '.primeAgent.officialSha256' release/release.json)"
            printf 'PRIME_LOCKFILE=%s\n' "$(jq -r '.primeAgent.lockfile' release/release.json)"
            printf 'PRIME_LOCKFILE_SHA256=%s\n' "$(jq -r '.primeAgent.lockfileSha256' release/release.json)"
            printf 'PRIME_WORKSPACE_POLICY=%s\n' "$(jq -r '.primeAgent.workspacePolicy' release/release.json)"
            printf 'PRIME_WORKSPACE_POLICY_SHA256=%s\n' "$(jq -r '.primeAgent.workspacePolicySha256' release/release.json)"
            printf 'RUNTIME_RELEASE_TAG=%s\n' "$(jq -r '.primeAgent.runtimeReleaseTag' release/release.json)"
            printf 'RUNTIME_ASSET=%s\n' "$(jq -r '.primeAgent.runtimeAsset' release/release.json)"
          } >> "$GITHUB_ENV"
          printf 'runtime_asset=%s\n' "$(jq -r '.primeAgent.runtimeAsset' release/release.json)" >> "$GITHUB_OUTPUT"

      - name: Reject an existing release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RUNTIME_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RUNTIME_RELEASE_TAG already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RUNTIME_RELEASE_TAG" >/dev/null 2>&1; then
            echo "tag $RUNTIME_RELEASE_TAG already exists" >&2
            exit 1
          fi

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare the pinned Prime source tree
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-release"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/prime-agent.tgz" "$PRIME_OFFICIAL_URL"
          printf '%s  %s\n' "$PRIME_OFFICIAL_SHA256" "$RUNNER_TEMP/prime-agent.tgz" | shasum -a 256 -c -
          for name in prime-source-one prime-source-two; do
            mkdir "$RUNNER_TEMP/$name"
            tar -xzf "$RUNNER_TEMP/prime-agent.tgz" -C "$RUNNER_TEMP/$name"
            cp "$PRIME_LOCKFILE" "$RUNNER_TEMP/$name/package/pnpm-lock.yaml"
            cp "$PRIME_WORKSPACE_POLICY" "$RUNNER_TEMP/$name/package/pnpm-workspace.yaml"
            printf '%s  %s\n' "$PRIME_LOCKFILE_SHA256" "$RUNNER_TEMP/$name/package/pnpm-lock.yaml" | shasum -a 256 -c -
            printf '%s  %s\n' "$PRIME_WORKSPACE_POLICY_SHA256" "$RUNNER_TEMP/$name/package/pnpm-workspace.yaml" | shasum -a 256 -c -
            pnpm --dir "$RUNNER_TEMP/$name/package" install --prod --frozen-lockfile
          done

      - name: Build and reproduce the runtime artifact
        run: |
          set -euo pipefail
          pnpm run build
          node dist/cli.js runtime-build \
            --source "$RUNNER_TEMP/prime-source-one/package" \
            --release-artifact "$RUNNER_TEMP/prime-agent.tgz" \
            --lockfile "$RUNNER_TEMP/prime-source-one/package/pnpm-lock.yaml" \
            --output "$RUNNER_TEMP/runtime-release/$RUNTIME_ASSET" \
            > "$RUNNER_TEMP/runtime-release/runtime-build.json"
          umask 077
          node dist/cli.js runtime-build \
            --source "$RUNNER_TEMP/prime-source-two/package" \
            --release-artifact "$RUNNER_TEMP/prime-agent.tgz" \
            --lockfile "$RUNNER_TEMP/prime-source-two/package/pnpm-lock.yaml" \
            --output "$RUNNER_TEMP/runtime-reproduction.tgz" \
            > "$RUNNER_TEMP/runtime-reproduction.json"
          cmp "$RUNNER_TEMP/runtime-release/$RUNTIME_ASSET" "$RUNNER_TEMP/runtime-reproduction.tgz"
          (
            cd "$RUNNER_TEMP/runtime-release"
            shasum -a 256 "$RUNTIME_ASSET" > SHA256SUMS
          )
          tar -xOf "$RUNNER_TEMP/runtime-release/$RUNTIME_ASSET" prime-runtime-manifest.json \
            > "$RUNNER_TEMP/runtime-release/$RUNTIME_ASSET.manifest.json"
          jq \
            --arg releaseTag "$RUNTIME_RELEASE_TAG" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg artifactSha256 "$(shasum -a 256 "$RUNNER_TEMP/runtime-release/$RUNTIME_ASSET" | awk '{print $1}')" \
            '. + {releaseTag:$releaseTag, sourceCommit:$sourceCommit, artifactSha256:$artifactSha256} | del(.artifactPath)' \
            "$RUNNER_TEMP/runtime-release/runtime-build.json" \
            > "$RUNNER_TEMP/runtime-release/release-metadata.json"

      - name: Generate runtime SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: ${{ runner.temp }}/runtime-release/${{ steps.contract.outputs.runtime_asset }}
          format: spdx-json
          output-file: ${{ runner.temp }}/runtime-release/${{ steps.contract.outputs.runtime_asset }}.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false

      - name: Attest runtime build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ runner.temp }}/runtime-release/${{ steps.contract.outputs.runtime_asset }}

      - name: Attest runtime SBOM
        uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
        with:
          subject-path: ${{ runner.temp }}/runtime-release/${{ steps.contract.outputs.runtime_asset }}
          sbom-path: ${{ runner.temp }}/runtime-release/${{ steps.contract.outputs.runtime_asset }}.spdx.json

      - name: Publish the immutable runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/runtime-release/RELEASE.md" <<EOF
          Checksum-pinned Prime Agent $PRIME_VERSION runtime for Darwin arm64 and Node $(node -p 'process.version').

          This runtime is an implementation dependency of Prime Agent Dispatch. Verify it with:

          \`gh attestation verify "$RUNTIME_ASSET" --repo "$GITHUB_REPOSITORY"\`
          EOF
          gh release create "$RUNTIME_RELEASE_TAG" \
            "$RUNNER_TEMP/runtime-release/$RUNTIME_ASSET" \
            "$RUNNER_TEMP/runtime-release/$RUNTIME_ASSET.manifest.json" \
            "$RUNNER_TEMP/runtime-release/$RUNTIME_ASSET.spdx.json" \
            "$RUNNER_TEMP/runtime-release/SHA256SUMS" \
            "$RUNNER_TEMP/runtime-release/release-metadata.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Prime Agent runtime $PRIME_VERSION r1" \
            --notes-file "$RUNNER_TEMP/runtime-release/RELEASE.md" \
            --prerelease \
            --draft
          gh release edit "$RUNTIME_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RUNTIME_RELEASE_TAG" --jq '.immutable')" = "true"
